<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clasificador de Uvas</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0a0010;
      --surface:     #110018;
      --card:        #1a0028;
      --border:      rgba(160, 80, 220, 0.2);
      --border-hi:   rgba(160, 80, 220, 0.5);
      --purple:      #7c3aed;
      --purple-hi:   #a855f7;
      --accent:      #c026d3;
      --text:        #f0e6ff;
      --text-muted:  rgba(240, 230, 255, 0.45);
      --bar-bg:      rgba(255,255,255,0.07);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text);
      padding: 32px 24px;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 36px;
    }
    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #e0aaff, #c026d3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p {
      margin-top: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* ── Main layout ── */
    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
      width: 100%;
      max-width: 1080px;
      background: var(--border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px var(--border);
    }

    .col {
      background: var(--card);
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .col-left  { border-radius: 20px 0 0 20px; }
    .col-right {
      border-radius: 0 20px 20px 0;
      background: var(--surface);
      justify-content: center;
    }

    /* ── Section label ── */
    .section-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* ── Mode tabs ── */
    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .mode-tab {
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.3px;
    }
    .mode-tab.active {
      background: linear-gradient(135deg, var(--purple), var(--accent));
      color: #fff;
    }

    /* ── Preview ── */
    .preview {
      width: 100%;
      aspect-ratio: 4/3;
      border-radius: 12px;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .preview canvas,
    .preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .preview-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--text-muted);
    }
    .preview-empty svg { width: 48px; height: 48px; opacity: 0.5; }
    .preview-empty span { font-size: 0.8rem; }

    /* ── Drop zone ── */
    .drop-zone {
      border: 1px dashed var(--border-hi);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .drop-zone:hover, .drop-zone.dragover {
      background: rgba(124, 58, 237, 0.08);
      border-color: var(--purple-hi);
    }
    .drop-zone svg { width: 28px; height: 28px; opacity: 0.5; margin-bottom: 8px; }
    .drop-zone p { font-size: 0.8rem; color: var(--text-muted); line-height: 1.5; }
    .drop-zone strong { color: var(--purple-hi); font-weight: 600; }
    #file-input { display: none; }

    /* ── Buttons ── */
    .btn {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: none;
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      letter-spacing: 0.3px;
    }
    .btn-fill {
      background: linear-gradient(135deg, var(--purple), var(--accent));
      color: #fff;
      box-shadow: 0 4px 20px rgba(124,58,237,0.35);
    }
    .btn-fill:hover   { opacity: 0.88; transform: translateY(-1px); }
    .btn-fill:active  { transform: translateY(0); }
    .btn-fill:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border-hi);
      color: var(--text-muted);
    }
    .btn-outline:hover { background: rgba(255,255,255,0.05); color: var(--text); }

    /* ── Status ── */
    .status {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      min-height: 18px;
    }

    /* ── Right panel: idle state ── */
    .idle-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
    }
    .idle-state svg { width: 56px; height: 56px; opacity: 0.2; }
    .idle-state p { font-size: 0.85rem; line-height: 1.6; max-width: 220px; }

    /* ── Results ── */
    .results { display: none; flex-direction: column; gap: 24px; }
    .results.visible { display: flex; }

    .result-item { display: flex; flex-direction: column; gap: 8px; }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .result-name {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
    }
    .result-pct {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--purple-hi);
      font-variant-numeric: tabular-nums;
    }

    .bar-track {
      height: 8px;
      background: var(--bar-bg);
      border-radius: 99px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--purple), var(--accent));
      transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
    }

    /* ── Winner card ── */
    .winner {
      margin-top: 8px;
      border-radius: 14px;
      padding: 24px;
      background: linear-gradient(135deg, rgba(124,58,237,0.25), rgba(192,38,211,0.25));
      border: 1px solid rgba(168, 85, 247, 0.3);
      text-align: center;
    }
    .winner-label {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--purple-hi);
      margin-bottom: 10px;
    }
    .winner-name {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .winner-conf {
      margin-top: 6px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    /* ── Responsive ── */
    @media (max-width: 720px) {
      .layout { grid-template-columns: 1fr; }
      .col-left  { border-radius: 20px 20px 0 0; }
      .col-right { border-radius: 0 0 20px 20px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Clasificador de Uvas</h1>
    <p>Italia &nbsp;&middot;&nbsp; Quebranta</p>
  </header>

  <div class="layout">

    <!-- ── LEFT: Input ── -->
    <div class="col col-left">
      <span class="section-label">Entrada</span>

      <div class="mode-tabs">
        <button class="mode-tab active" id="tab-cam" onclick="switchMode('camera')">Camara en vivo</button>
        <button class="mode-tab"        id="tab-img" onclick="switchMode('upload')">Subir imagen</button>
      </div>

      <!-- Preview -->
      <div class="preview" id="preview-box">
        <div class="preview-empty" id="preview-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          <span>La imagen aparecera aqui</span>
        </div>
        <img id="uploaded-img" style="display:none" alt="imagen"/>
      </div>

      <!-- Camera controls -->
      <div id="cam-controls">
        <button class="btn btn-fill" id="cam-btn" onclick="initCamera()">Iniciar camara</button>
        <button class="btn btn-outline" id="cam-stop" style="display:none;margin-top:10px" onclick="stopCamera()">Detener camara</button>
      </div>

      <!-- Upload controls -->
      <div id="upload-controls" style="display:none; flex-direction:column; gap:12px;">
        <label class="drop-zone" id="drop-zone" for="file-input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <polyline points="16 16 12 12 8 16"/>
            <line x1="12" y1="12" x2="12" y2="21"/>
            <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
          </svg>
          <p>Arrastra una imagen o <strong>haz clic para seleccionar</strong></p>
          <input type="file" id="file-input" accept="image/*" onchange="handleFile(event)"/>
        </label>
        <button class="btn btn-fill" id="img-btn" onclick="classifyImage()" disabled>Clasificar</button>
      </div>

      <p class="status" id="status-msg"></p>
    </div>

    <!-- ── RIGHT: Results ── -->
    <div class="col col-right">
      <span class="section-label">Clasificacion</span>

      <!-- Idle -->
      <div class="idle-state" id="idle-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <p>Inicia la camara o sube una imagen para ver los resultados</p>
      </div>

      <!-- Results -->
      <div class="results" id="results-panel">
        <div id="bars-container"></div>
        <div class="divider"></div>
        <div class="winner" id="winner-card">
          <div class="winner-label">Resultado</div>
          <div class="winner-name" id="winner-name">—</div>
          <div class="winner-conf" id="winner-conf"></div>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <script>
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/taJCbfxNC/";
    let model, webcam, rafId, mode = 'camera';

    function switchMode(m) {
      mode = m;
      document.getElementById('tab-cam').classList.toggle('active', m === 'camera');
      document.getElementById('tab-img').classList.toggle('active', m === 'upload');
      document.getElementById('cam-controls').style.display    = m === 'camera' ? 'block'  : 'none';
      document.getElementById('upload-controls').style.display = m === 'upload' ? 'flex'   : 'none';
      if (m !== 'camera') stopCamera();
      resetPreview();
      hideResults();
    }

    async function loadModel() {
      if (model) return;
      model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
    }

    function setStatus(msg) { document.getElementById('status-msg').textContent = msg; }

    function resetPreview() {
      document.getElementById('preview-empty').style.display = 'flex';
      const img = document.getElementById('uploaded-img');
      img.style.display = 'none';
      img.src = '';
    }

    function showResults() {
      document.getElementById('idle-state').style.display = 'none';
      document.getElementById('results-panel').classList.add('visible');
    }

    function hideResults() {
      document.getElementById('idle-state').style.display = 'flex';
      document.getElementById('results-panel').classList.remove('visible');
    }

    function buildBars(predictions) {
      const c = document.getElementById('bars-container');
      c.innerHTML = '';
      predictions.forEach((p, i) => {
        c.innerHTML += `
          <div class="result-item">
            <div class="result-header">
              <span class="result-name" id="lbl-${i}">${p.className}</span>
              <span class="result-pct"  id="pct-${i}">0%</span>
            </div>
            <div class="bar-track"><div class="bar-fill" id="bar-${i}" style="width:0%"></div></div>
          </div>`;
      });
    }

    function updateBars(predictions) {
      let best = predictions[0];
      predictions.forEach((p, i) => {
        const pct = Math.round(p.probability * 100);
        document.getElementById(`pct-${i}`).textContent = pct + '%';
        document.getElementById(`bar-${i}`).style.width = pct + '%';
        if (p.probability > best.probability) best = p;
      });
      document.getElementById('winner-name').textContent = best.className;
      document.getElementById('winner-conf').textContent = Math.round(best.probability * 100) + '% de confianza';
    }

    /* ── CAMERA ── */
    async function initCamera() {
      const btn = document.getElementById('cam-btn');
      btn.disabled = true;
      setStatus('Cargando modelo...');
      await loadModel();

      webcam = new tmImage.Webcam(480, 360, true);
      await webcam.setup();
      await webcam.play();

      const box = document.getElementById('preview-box');
      document.getElementById('preview-empty').style.display = 'none';
      box.appendChild(webcam.canvas);

      buildBars(Array.from({length: model.getTotalClasses()}, (_, i) => ({className: '', probability: 0})));
      showResults();
      document.getElementById('cam-stop').style.display = 'block';
      btn.style.display = 'none';
      setStatus('Clasificando en tiempo real...');

      async function loop() {
        webcam.update();
        const preds = await model.predict(webcam.canvas);
        if (document.getElementById('bars-container').children.length === 0) buildBars(preds);
        // update labels first time
        preds.forEach((p, i) => { document.getElementById(`lbl-${i}`).textContent = p.className; });
        updateBars(preds);
        rafId = requestAnimationFrame(loop);
      }
      loop();
    }

    function stopCamera() {
      if (rafId) cancelAnimationFrame(rafId);
      if (webcam) {
        webcam.stop();
        const canvas = document.getElementById('preview-box').querySelector('canvas');
        if (canvas) canvas.remove();
        webcam = null;
      }
      document.getElementById('preview-empty').style.display = 'flex';
      document.getElementById('cam-btn').style.display = 'block';
      document.getElementById('cam-btn').disabled = false;
      document.getElementById('cam-stop').style.display = 'none';
      hideResults();
      setStatus('');
    }

    /* ── UPLOAD ── */
    const dz = document.getElementById('drop-zone');
    dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('dragover'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
    dz.addEventListener('drop', e => {
      e.preventDefault(); dz.classList.remove('dragover');
      const f = e.dataTransfer.files[0];
      if (f && f.type.startsWith('image/')) loadPreview(f);
    });

    function handleFile(e) { if (e.target.files[0]) loadPreview(e.target.files[0]); }

    function loadPreview(file) {
      const reader = new FileReader();
      reader.onload = ev => {
        const img = document.getElementById('uploaded-img');
        img.src = ev.target.result;
        img.style.display = 'block';
        document.getElementById('preview-empty').style.display = 'none';
        document.getElementById('img-btn').disabled = false;
        hideResults();
        setStatus('Imagen lista.');
      };
      reader.readAsDataURL(file);
    }

    async function classifyImage() {
      const btn = document.getElementById('img-btn');
      btn.disabled = true;
      setStatus('Cargando modelo...');
      await loadModel();
      setStatus('Clasificando...');
      const preds = await model.predict(document.getElementById('uploaded-img'));
      buildBars(preds);
      showResults();
      updateBars(preds);
      btn.disabled = false;
      setStatus('Clasificacion completada.');
    }
  </script>
</body>
</html>
