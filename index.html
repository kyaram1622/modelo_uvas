<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clasificador de Uvas 🍇</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple-dark: #2d0057;
      --purple-mid:  #6a0dad;
      --purple-light:#b44fe8;
      --accent:      #e040fb;
      --glass:       rgba(255,255,255,0.08);
      --glass-border:rgba(255,255,255,0.18);
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(145deg, var(--purple-dark) 0%, #1a003a 50%, #0d001f 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #fff;
    }

    /* ── Layout wrapper ── */
    .app-wrapper {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 32px;
    }
    header .emoji { font-size: 3.5rem; display: block; margin-bottom: 8px; }
    header h1 { font-size: 2rem; font-weight: 700; letter-spacing: 1px; }
    header p  { opacity: 0.65; font-size: 0.9rem; margin-top: 4px; }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      gap: 8px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 50px;
      padding: 6px;
      margin-bottom: 28px;
    }
    .tab {
      padding: 10px 28px;
      border-radius: 50px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.6);
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
    }
    .tab.active {
      background: linear-gradient(135deg, var(--purple-mid), var(--accent));
      color: #fff;
      box-shadow: 0 4px 18px rgba(180,79,232,0.45);
    }

    /* ── Card ── */
    .card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(18px);
      border-radius: 24px;
      padding: 32px;
      width: 100%;
      max-width: 1100px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    /* ── Panels ── */
    .panel { display: none; }
    .panel.active {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto;
      gap: 28px;
      align-items: start;
    }

    .panel-left  { display: flex; flex-direction: column; gap: 16px; }
    .panel-right { display: flex; flex-direction: column; gap: 16px; justify-content: center; }

    /* ── Preview area ── */
    .preview-box {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 2px dashed var(--glass-border);
      max-height: 420px;
    }
    .preview-box canvas,
    .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 14px;
    }
    .preview-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0.4;
      pointer-events: none;
    }
    .preview-placeholder svg { width: 56px; height: 56px; }
    .preview-placeholder span { font-size: 0.85rem; }

    /* ── Buttons ── */
    .btn-primary {
      width: 100%;
      padding: 14px;
      border-radius: 50px;
      border: none;
      background: linear-gradient(135deg, var(--purple-mid), var(--accent));
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(180,79,232,0.4);
    }
    .btn-primary:hover  { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(180,79,232,0.55); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-secondary {
      padding: 10px 24px;
      border-radius: 50px;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      color: rgba(255,255,255,0.8);
      font-family: 'Poppins', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.15); }

    /* ── Upload drop zone ── */
    .drop-zone {
      width: 100%;
      border: 2px dashed var(--purple-light);
      border-radius: 16px;
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .drop-zone:hover, .drop-zone.dragover {
      background: rgba(180,79,232,0.12);
      border-color: var(--accent);
    }
    .drop-zone svg { width: 40px; height: 40px; opacity: 0.7; margin-bottom: 8px; }
    .drop-zone p  { font-size: 0.88rem; opacity: 0.7; }
    .drop-zone strong { color: var(--accent); }
    #file-input { display: none; }

    /* ── Results ── */
    .results-box {
      width: 100%;
      background: rgba(0,0,0,0.25);
      border-radius: 16px;
      padding: 24px;
      display: none;
    }
    .results-box.visible { display: block; }

    .results-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.5;
      margin-bottom: 20px;
    }

    .result-item { margin-bottom: 14px; }
    .result-item:last-child { margin-bottom: 0; }

    .result-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .bar-bg {
      background: rgba(255,255,255,0.12);
      border-radius: 50px;
      height: 10px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 50px;
      background: linear-gradient(90deg, var(--purple-mid), var(--accent));
      transition: width 0.35s ease;
    }

    .winner-badge {
      margin-top: 20px;
      text-align: center;
      background: linear-gradient(135deg, var(--purple-mid), var(--accent));
      border-radius: 16px;
      padding: 18px 20px;
      font-size: 1.2rem;
      font-weight: 700;
      box-shadow: 0 4px 20px rgba(180,79,232,0.4);
      letter-spacing: 0.5px;
    }
    .winner-badge small {
      display: block;
      font-size: 0.72rem;
      font-weight: 400;
      opacity: 0.75;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      .panel.active { grid-template-columns: 1fr; }
    }

    /* ── Status ── */
    .status {
      font-size: 0.8rem;
      opacity: 0.55;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">

    <header>
      <h1>Clasificador de Uvas</h1>
      <p>Italia &nbsp;·&nbsp; Quebranta</p>
    </header>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('camera')">📷 Cámara</button>
      <button class="tab"        onclick="switchTab('upload')">🖼️ Imagen</button>
    </div>

    <div class="card">

      <!-- ── CAMERA PANEL ── -->
      <div class="panel active" id="panel-camera">

        <div class="panel-left">
          <div class="preview-box" id="cam-preview">
            <div class="preview-placeholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
              </svg>
              <span>La cámara aparecerá aquí</span>
            </div>
          </div>
          <button class="btn-primary" id="cam-btn" onclick="initCamera()">Iniciar cámara</button>
          <button class="btn-secondary" id="cam-stop-btn" style="display:none" onclick="stopCamera()">Detener cámara</button>
          <p class="status" id="cam-status"></p>
        </div>

        <div class="panel-right">
          <div class="results-box" id="cam-results">
            <p class="results-title">Resultados</p>
            <div id="cam-label-container"></div>
            <div class="winner-badge" id="cam-winner"><small>Clasificación</small>—</div>
          </div>
        </div>

      </div>

      <!-- ── UPLOAD PANEL ── -->
      <div class="panel" id="panel-upload">

        <div class="panel-left">
          <div class="preview-box" id="img-preview">
            <div class="preview-placeholder" id="img-placeholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
              <span>Vista previa</span>
            </div>
            <img id="uploaded-img" style="display:none" alt="imagen subida"/>
          </div>
          <label class="drop-zone" id="drop-zone" for="file-input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/>
              <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
            </svg>
            <p>Arrastra una imagen aquí o <strong>haz clic para seleccionar</strong></p>
            <input type="file" id="file-input" accept="image/*" onchange="handleFile(event)"/>
          </label>
          <button class="btn-primary" id="img-btn" onclick="classifyImage()" disabled>Clasificar imagen</button>
          <p class="status" id="img-status"></p>
        </div>

        <div class="panel-right">
          <div class="results-box" id="img-results">
            <p class="results-title">Resultados</p>
            <div id="img-label-container"></div>
            <div class="winner-badge" id="img-winner"><small>Clasificación</small>—</div>
          </div>
        </div>

      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <script>
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/taJCbfxNC/";
    let model, webcam, rafId;
    let currentTab = 'camera';

    // ── Tab switching ──
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (i === 0) === (tab === 'camera')));
      document.getElementById('panel-camera').classList.toggle('active', tab === 'camera');
      document.getElementById('panel-upload').classList.toggle('active', tab === 'upload');
      if (tab !== 'camera') stopCamera();
    }

    // ── Load model (shared) ──
    async function loadModel() {
      if (model) return;
      model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
    }

    // ── Build result bars ──
    function buildBars(containerId, count, classes) {
      const c = document.getElementById(containerId);
      c.innerHTML = '';
      for (let i = 0; i < count; i++) {
        c.innerHTML += `
          <div class="result-item">
            <div class="result-label"><span id="${containerId}-lbl-${i}">${classes ? classes[i] : ''}</span><span id="${containerId}-pct-${i}">0%</span></div>
            <div class="bar-bg"><div class="bar-fill" id="${containerId}-bar-${i}" style="width:0%"></div></div>
          </div>`;
      }
    }

    function updateBars(containerId, predictions, winnerId) {
      let best = predictions[0];
      predictions.forEach((p, i) => {
        const pct = Math.round(p.probability * 100);
        document.getElementById(`${containerId}-lbl-${i}`).textContent = p.className;
        document.getElementById(`${containerId}-pct-${i}`).textContent = pct + '%';
        document.getElementById(`${containerId}-bar-${i}`).style.width = pct + '%';
        if (p.probability > best.probability) best = p;
      });
      document.getElementById(winnerId).innerHTML = '<small>Clasificación</small>🍇 ' + best.className;
    }

    // ── CAMERA ──
    async function initCamera() {
      const btn = document.getElementById('cam-btn');
      const status = document.getElementById('cam-status');
      btn.disabled = true;
      status.textContent = 'Cargando modelo…';

      await loadModel();

      webcam = new tmImage.Webcam(400, 400, true);
      await webcam.setup();
      await webcam.play();

      const preview = document.getElementById('cam-preview');
      preview.innerHTML = '';
      preview.appendChild(webcam.canvas);

      buildBars('cam-label-container', model.getTotalClasses());
      document.getElementById('cam-results').classList.add('visible');
      document.getElementById('cam-winner').innerHTML = '<small>Clasificación</small>Analizando…';
      document.getElementById('cam-stop-btn').style.display = 'inline-block';
      btn.style.display = 'none';
      status.textContent = 'Clasificando en tiempo real…';

      async function loop() {
        webcam.update();
        const preds = await model.predict(webcam.canvas);
        updateBars('cam-label-container', preds, 'cam-winner');
        rafId = requestAnimationFrame(loop);
      }
      loop();
    }

    function stopCamera() {
      if (rafId) cancelAnimationFrame(rafId);
      if (webcam) { webcam.stop(); webcam = null; }
      const preview = document.getElementById('cam-preview');
      preview.innerHTML = `<div class="preview-placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg><span>La cámara aparecerá aquí</span></div>`;
      document.getElementById('cam-results').classList.remove('visible');
      document.getElementById('cam-btn').style.display = 'inline-block';
      document.getElementById('cam-btn').disabled = false;
      document.getElementById('cam-stop-btn').style.display = 'none';
      document.getElementById('cam-status').textContent = '';
    }

    // ── UPLOAD ──
    const dropZone = document.getElementById('drop-zone');
    dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) loadPreview(file);
    });

    function handleFile(e) {
      const file = e.target.files[0];
      if (file) loadPreview(file);
    }

    function loadPreview(file) {
      const reader = new FileReader();
      reader.onload = ev => {
        const img = document.getElementById('uploaded-img');
        img.src = ev.target.result;
        img.style.display = 'block';
        document.getElementById('img-placeholder').style.display = 'none';
        document.getElementById('img-btn').disabled = false;
        document.getElementById('img-results').classList.remove('visible');
        document.getElementById('img-status').textContent = 'Imagen lista. Haz clic en Clasificar.';
      };
      reader.readAsDataURL(file);
    }

    async function classifyImage() {
      const btn = document.getElementById('img-btn');
      const status = document.getElementById('img-status');
      btn.disabled = true;
      status.textContent = 'Cargando modelo…';

      await loadModel();

      const img = document.getElementById('uploaded-img');
      status.textContent = 'Clasificando…';

      const preds = await model.predict(img);
      buildBars('img-label-container', preds.length);
      document.getElementById('img-results').classList.add('visible');
      updateBars('img-label-container', preds, 'img-winner');

      btn.disabled = false;
      status.textContent = 'Clasificación completada ✓';
    }
  </script>
</body>
</html>
